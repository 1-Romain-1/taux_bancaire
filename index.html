<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Simulateur de prêt bancaire</title>
  <script  type="module" src="script/script.mjs" defer></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Simulateur de prêt bancaire</h1>

<label for="montant">Montant (€) :</label>
<input type="number" id="montant" step="0.01" placeholder="100000"><br>

<label for="taux">Taux annuel (%) :</label>
<input type="number" id="taux" step="0.01" placeholder="2"><br>

<label for="duree">Durée (années) :</label>
<input type="number" id="duree" step="1" placeholder="10"><br>

<button id="btnCalculer" >Calculer</button>

<div id="resultat"></div>



</body>
</html>
